name: CI/CD — Auroara LMS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: auroara_lms_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, xml, ctype, json, bcmath
          coverage: none

      - name: Install Composer dependencies
        run: |
          mkdir -p bootstrap/cache storage/framework/{sessions,views,cache}
          composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install NPM dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      - name: Copy env
        run: cp .env.example .env

      - name: Generate key
        run: php artisan key:generate

      - name: Run migrations
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: auroara_lms_test
          DB_USERNAME: root
          DB_PASSWORD: password
        run: php artisan migrate --force

      - name: Run tests
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: auroara_lms_test
          DB_USERNAME: root
          DB_PASSWORD: password
        run: php artisan test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Install Composer dependencies (production)
        run: |
          mkdir -p bootstrap/cache storage/framework/{sessions,views,cache}
          composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install NPM & build
        run: |
          npm ci
          npm run build

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.BLUEHOST_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.BLUEHOST_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy via rsync (incremental)
        run: |
          rsync -azv --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            --exclude '.git/' \
            --exclude 'node_modules/' \
            --exclude '.env' \
            --exclude 'tests/' \
            --exclude 'storage/logs/' \
            --exclude 'storage/framework/cache/' \
            --exclude 'storage/framework/sessions/' \
            --exclude 'storage/framework/views/' \
            --exclude 'public/uploads/' \
            ./ ${{ secrets.BLUEHOST_USERNAME }}@${{ secrets.BLUEHOST_HOST }}:${{ secrets.BLUEHOST_REMOTE_PATH }}

      - name: Post-deploy commands
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.BLUEHOST_HOST }}
          username: ${{ secrets.BLUEHOST_USERNAME }}
          key: ${{ secrets.BLUEHOST_SSH_KEY }}
          command_timeout: 5m
          script: |
            cd ${{ secrets.BLUEHOST_REMOTE_PATH }}
            php artisan migrate --force
            php artisan db:seed --class=CourseCategorySeeder --force
            php artisan db:seed --class=CourseSeeder --force
            php artisan db:seed --class=CourseSeederBatch2 --force
            php artisan db:seed --class=CourseSeederBatch3 --force
            php artisan db:seed --class=PhishingTemplateSeeder --force
            php artisan db:seed --class=BadgeSeeder --force
            php artisan db:seed --class=VideoLessonSeeder --force
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            # Sync public assets to served site folder
            cp -r public/build public/images ~/public_html/website_0b6edf36/ 2>/dev/null || true
            mkdir -p public/uploads/branding
            [ -L ~/public_html/website_0b6edf36/uploads ] || ln -s $(pwd)/public/uploads ~/public_html/website_0b6edf36/uploads 2>/dev/null || cp -r public/uploads ~/public_html/website_0b6edf36/ 2>/dev/null || true
